[package]
name = "wezztershier-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wezztershier-web"
path = "src/main.rs"

[dependencies]
# Core wezztershier library
wezztershier-core = { path = "../src-core" }

# Web server
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"