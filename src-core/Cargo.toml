[package]
name = "wezztershier-core"
version = "0.3.0"
edition = "2021"

[lib]
name = "wezztershier_core"
path = "src/lib.rs"

[dependencies]
# Parser dependencies
nom = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"

# File operations
tokio = { version = "1.0", features = ["fs", "io-util"] }
dirs = "5.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
tokio = { version = "1.0", features = ["test-util", "rt", "macros"] }